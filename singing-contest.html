<script>
    document.addEventListener('DOMContentLoaded', function() {
        // 精確設定開放時間：2026年10月27日 中午 12:00:00 (台灣時間 UTC+8)
        const openTime = new Date(2026, 9, 27, 12, 0, 0).getTime(); // 月份為 0-indexed，9 代表 10 月
        const formUrl = "https://docs.google.com/forms/d/e/1FAIpQLSdkxTtaF6EVwjOAcDw_XMCemXlQfZP02KHHXEc7KKaXD0cBDw/viewform?usp=header";

        const daysEl = document.getElementById("days");
        const hoursEl = document.getElementById("hours");
        const minutesEl = document.getElementById("minutes");
        const secondsEl = document.getElementById("seconds");
        
        const countdownTitle = document.getElementById("countdown-title");
        const navBtn = document.getElementById("nav-register-btn");
        const mainBtn = document.getElementById("main-register-btn");
        const bottomBtn = document.getElementById("bottom-register-btn");
        const bottomStatusText = document.getElementById("bottom-status-text");

        let isUnlocked = false;

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = openTime - now;

            if (distance > 0) {
                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                daysEl.innerText = String(days).padStart(2, '0');
                hoursEl.innerText = String(hours).padStart(2, '0');
                minutesEl.innerText = String(minutes).padStart(2, '0');
                secondsEl.innerText = String(seconds).padStart(2, '0');
            } else {
                if (!isUnlocked) {
                    isUnlocked = true;
                    daysEl.innerText = "00";
                    hoursEl.innerText = "00";
                    minutesEl.innerText = "00";
                    secondsEl.innerText = "00";

                    countdownTitle.innerText = "🎉【蒔光好聲音】報名已正式開放！";
                    
                    // 時間到達自動開啟按鈕
                    setBtnActive(mainBtn, "🎤 點我立即報名蒔光好聲音 ↗");
                    setBtnActive(bottomBtn, "🎤 開啟【蒔光好聲音】Google 官方報名表單 ↗");
                    setBtnActive(navBtn, "報名蒔光好聲音 ↗");

                    if (bottomStatusText) {
                        bottomStatusText.innerText = "名額有限，額滿為止！";
                    }
                }
            }
        }

        function setBtnActive(btn, text) {
            if (btn) {
                btn.innerText = text;
                btn.classList.remove("opacity-75", "cursor-not-allowed");
                btn.href = formUrl;
                btn.onclick = null;
            }
        }

        function setBtnLocked(btn, text) {
            if (btn) {
                btn.innerText = text;
                btn.removeAttribute("href");
                btn.onclick = function(e) {
                    e.preventDefault();
                    alert("⏰【蒔光好聲音】將於 2026/10/27 (二) 中午 12:00 正式開放報名，敬請期待！");
                };
            }
        }

        // 初始狀態鎖定
        const nowTime = new Date().getTime();
        if (nowTime < openTime) {
            setBtnLocked(mainBtn, "🔒 報名尚未開放 (10/27 中午12:00開放)");
            setBtnLocked(bottomBtn, "🔒 報名尚未開放 (10/27 中午12:00開放)");
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);
    });
</script>
